name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 全局 rustc 警告门禁（审查 m3 恢复）：workspace 当前零依赖，安全；
  # 引入依赖后若出现无法消除的依赖警告，改为在 crate 内局部放宽并注明理由。
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # 审查 m2：M0 验收示例的端到端断言纳入门禁（cargo test 只编译不运行 bin）。
      - name: run hello-plugin (M0 验收)
        run: cargo run --quiet -p hello-plugin

      # M1：先构建 wasm guest 组件（独立 crate，非 workspace 成员），
      # 供 cordis-wasm 的加载测试使用（tests/load_guest.rs 按约定路径查找）。
      - name: build wasm guest (M1)
        run: cargo build --manifest-path examples/wasm-plugin-rust/Cargo.toml --target wasm32-wasip2
