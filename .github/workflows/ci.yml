name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 全局 rustc 警告门禁（审查 m3 恢复）：workspace 当前零依赖，安全；
  # 引入依赖后若出现无法消除的依赖警告，改为在 crate 内局部放宽并注明理由。
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      # Go guest 需要 go >= 1.24（go:wasmexport / wasmimport 括号语法）
      # 与 `go 1.25` 指令；固定版本避免 runner 镜像漂移。
      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # 审查 B1（REVIEW-73314ba）：wasm guest 是独立 crate（非 workspace
      # 成员、独立 target 目录、rust-cache 不覆盖）——必须在 cargo test
      # **之前**构建，否则 cordis-wasm 的加载测试在干净环境必然失败。
      - name: build wasm guest (M1)
        run: |
          cargo build --manifest-path examples/wasm-plugin-rust/Cargo.toml --target wasm32-wasip2
          cargo build --manifest-path examples/wasm-plugin-rust-consumer/Cargo.toml --target wasm32-wasip2
          # 沙箱隔离门禁（PR #14 门禁 2/3）：恶意 guest 同样预构建。
          cargo build --manifest-path examples/wasm-plugin-rust-panic/Cargo.toml --target wasm32-wasip2
          # 走查记录⑧ 直证（PR #17）：违规 guest（越界 set）同样预构建。
          cargo build --manifest-path examples/wasm-plugin-rust-misbehave/Cargo.toml --target wasm32-wasip2

      # Go guest（PR #14 门禁 3/3 双语言验收）：标准 go → wasip1 核心模块
      # → 预览1 适配器组件化（tools/componentize + vendored 适配器）。
      # gofmt 门禁（审查 nit1）：fork 与应用侧 Go 代码须 gofmt 干净
      #（生成代码由 wit-bindgen --format 排好，天然通过）。
      - name: build wasm guest (Go)
        run: |
          go version
          test -z "$(gofmt -l third_party/go-pkg examples/wasm-plugin-go)"
          examples/wasm-plugin-go/build.sh

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # 审查 m2：M0 验收示例的端到端断言纳入门禁（cargo test 只编译不运行 bin）。
      - name: run hello-plugin (M0 验收)
        run: cargo run --quiet -p hello-plugin

      # M3 案例门禁：IM-bot 三层拓扑 + 服务代理 broker（全部断言通过即成功）。
      - name: run im-bot (M3 案例)
        run: |
          cargo run --quiet -p im-bot
          cargo run --quiet -p im-bot --bin broker
