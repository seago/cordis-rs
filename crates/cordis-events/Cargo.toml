[package]
name = "cordis-events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "cordis-events 层（草案 v0.3.1）：类型化事件 + 四种 sync 派发 + 订阅即效应"

[lints]
workspace = true

[dependencies]
# 零第三方：仅依赖 cordis-core（计划 §5 纪律）。
cordis-core = { path = "../cordis-core" }

[dev-dependencies]
# 仅测试用（async 监听器投递 + loader 集成）；run-deps 保持零第三方。
cordis-loader = { path = "../cordis-loader" }
tokio = { version = "1", features = ["rt", "macros"] }
