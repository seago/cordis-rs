[package]
name = "componentize"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "cordis 构建工具：将 wasip1 核心模块编码为组件模型组件（预览1 适配器）"

[lints]
workspace = true

[dependencies]
anyhow = "1"
# 0.256：与 wasmtime 47.0.3 的适配器（wasi-preview1-component-adapter-
# provider 47.0.3）对齐。workspace 内 wit-bindgen 0.60 内嵌 0.254，
# 形成 0.254/0.256 双版本并行——客观约束（适配器版本对齐），Cargo.lock 锁定。
wit-component = "0.256"
wit-parser = "0.256"
